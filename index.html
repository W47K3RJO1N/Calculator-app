<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8eee8">
  <title>Counterpoint Calculator</title>
  <style>
    :root {
      color-scheme: light;
      --page: #e8eee8;
      --ink: #202a27;
      --muted: #75817a;
      --panel: #f8faf6;
      --key: #edf1eb;
      --key-hover: #e2e9e1;
      --accent: #e66d4e;
      --accent-dark: #ce5639;
      --mint: #b6d9c9;
      --line: #dfe6de;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 280px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background-color: var(--page);
      background-image: radial-gradient(#cdd9cf 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    .calculator {
      width: min(100%, 368px);
      padding: 24px;
      border: 1px solid rgba(32, 42, 39, 0.07);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 22px 60px rgba(40, 58, 47, 0.13), 0 3px 10px rgba(40, 58, 47, 0.06);
      animation: arrive 420ms ease-out both;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      margin: 0;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .edition {
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      font-style: italic;
    }

    .screen {
      min-height: 126px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
      padding: 16px 4px 20px;
      border-bottom: 1px solid var(--line);
      text-align: right;
    }

    .expression {
      width: 100%;
      min-height: 20px;
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .display {
      width: 100%;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 12vw, 54px);
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding-top: 18px;
    }

    button {
      min-width: 0;
      aspect-ratio: 1.2;
      border: 0;
      border-radius: 6px;
      color: var(--ink);
      background: var(--key);
      font: inherit;
      font-size: 19px;
      cursor: pointer;
      transition: background-color 120ms ease, transform 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: var(--key-hover); }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 3px solid #4c8a70; outline-offset: 2px; }

    .utility {
      color: #53645b;
      font-size: 15px;
      font-weight: 650;
    }

    .operator {
      color: var(--accent-dark);
      background: #f8e9e2;
      font-size: 23px;
    }

    .operator:hover { background: #f3dcd2; }
    .operator[aria-pressed="true"] { color: white; background: var(--accent); }

    .equals {
      color: #19372a;
      background: var(--mint);
      font-size: 23px;
      font-weight: 650;
    }

    .equals:hover { background: #a4cdb9; }

    .footnote {
      margin: 16px 0 0;
      color: #8b958e;
      font-size: 11px;
      text-align: center;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 360px) {
      body { padding: 14px; }
      .calculator { padding: 18px; }
      .keypad { gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="topline">
      <h1 class="brand">Counterpoint</h1>
      <span class="edition">everyday arithmetic</span>
    </header>

    <section class="screen" aria-label="Calculator display">
      <div class="expression" id="expression" aria-hidden="true"></div>
      <output class="display" id="display" aria-live="polite" aria-atomic="true">0</output>
    </section>

    <section class="keypad" aria-label="Calculator keys">
      <button class="utility" type="button" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" type="button" data-action="sign" aria-label="Change sign">+/−</button>
      <button class="utility" type="button" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" type="button" data-operator="divide" aria-label="Divide">÷</button>

      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <button class="operator" type="button" data-operator="multiply" aria-label="Multiply">×</button>

      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button class="operator" type="button" data-operator="subtract" aria-label="Subtract">−</button>

      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button class="operator" type="button" data-operator="add" aria-label="Add">+</button>

      <button class="utility" type="button" data-action="backspace" aria-label="Delete last digit">⌫</button>
      <button class="zero" type="button" data-digit="0">0</button>
      <button type="button" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" type="button" data-action="equals" aria-label="Equals">=</button>
    </section>
    <p class="footnote">A little room for the numbers.</p>
  </main>

  <script>
    const display = document.querySelector("#display");
    const expression = document.querySelector("#expression");
    const keypad = document.querySelector(".keypad");
    const operatorButtons = [...document.querySelectorAll("[data-operator]")];
    const symbols = { add: "+", subtract: "−", multiply: "×", divide: "÷" };

    let entry = "0";
    let storedValue = null;
    let pendingOperator = null;
    let replaceEntry = false;
    let justCalculated = false;

    function render() {
      display.textContent = entry;
      operatorButtons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.operator === pendingOperator));
      });
    }

    function formatNumber(value) {
      if (!Number.isFinite(value)) return "Error";
      const rounded = Number(value.toPrecision(10));
      return String(Object.is(rounded, -0) ? 0 : rounded);
    }

    function calculate(left, right, operator) {
      if (operator === "add") return left + right;
      if (operator === "subtract") return left - right;
      if (operator === "multiply") return left * right;
      if (operator === "divide") return right === 0 ? NaN : left / right;
      return right;
    }

    function inputDigit(digit) {
      if (entry === "Error" || justCalculated) expression.textContent = "";
      if (entry === "Error" || replaceEntry || justCalculated) {
        entry = digit;
        replaceEntry = false;
        justCalculated = false;
      } else if (entry.replace("-", "").replace(".", "").length < 10) {
        entry = entry === "0" ? digit : entry + digit;
      }
      render();
    }

    function chooseOperator(operator) {
      if (entry === "Error") return;
      const value = Number(entry);

      if (pendingOperator && !replaceEntry) {
        const result = calculate(storedValue, value, pendingOperator);
        entry = formatNumber(result);
        if (entry === "Error") {
          reset();
          entry = "Error";
          render();
          return;
        }
        storedValue = Number(entry);
      } else {
        storedValue = value;
      }

      pendingOperator = operator;
      replaceEntry = true;
      justCalculated = false;
      expression.textContent = `${formatNumber(storedValue)} ${symbols[operator]}`;
      render();
    }

    function equals() {
      if (!pendingOperator || replaceEntry || entry === "Error") return;
      const left = storedValue;
      const right = Number(entry);
      const result = formatNumber(calculate(left, right, pendingOperator));
      expression.textContent = `${formatNumber(left)} ${symbols[pendingOperator]} ${formatNumber(right)} =`;
      entry = result;
      storedValue = null;
      pendingOperator = null;
      replaceEntry = true;
      justCalculated = true;
      render();
    }

    function reset() {
      entry = "0";
      storedValue = null;
      pendingOperator = null;
      replaceEntry = false;
      justCalculated = false;
      expression.textContent = "";
      render();
    }

    function backspace() {
      if (entry === "Error" || replaceEntry || justCalculated) {
        reset();
        return;
      }
      entry = entry.length > 1 ? entry.slice(0, -1) : "0";
      if (entry === "-") entry = "0";
      render();
    }

    function applyAction(action) {
      if (action === "clear") reset();
      if (action === "backspace") backspace();
      if (action === "decimal") {
        if (entry === "Error" || justCalculated) expression.textContent = "";
        if (entry === "Error" || replaceEntry || justCalculated) {
          entry = "0.";
          replaceEntry = false;
          justCalculated = false;
        } else if (!entry.includes(".")) {
          entry += ".";
        }
        render();
      }
      if (action === "sign" && entry !== "Error") {
        entry = formatNumber(-Number(entry));
        render();
      }
      if (action === "percent" && entry !== "Error") {
        entry = formatNumber(Number(entry) / 100);
        render();
      }
      if (action === "equals") equals();
    }

    keypad.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) inputDigit(button.dataset.digit);
      if (button.dataset.operator) chooseOperator(button.dataset.operator);
      if (button.dataset.action) applyAction(button.dataset.action);
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) inputDigit(event.key);
      else if (event.key === ".") applyAction("decimal");
      else if (event.key === "Enter" || event.key === "=") { event.preventDefault(); equals(); }
      else if (event.key === "Backspace") backspace();
      else if (event.key === "Escape") reset();
      else if (event.key === "+") chooseOperator("add");
      else if (event.key === "-") chooseOperator("subtract");
      else if (event.key === "*") chooseOperator("multiply");
      else if (event.key === "/") { event.preventDefault(); chooseOperator("divide"); }
      else if (event.key === "%") applyAction("percent");
    });

    render();
  </script>
</body>
</html>
